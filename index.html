<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mutants & Masterminds 3e Quick Reference</title>
    <meta name="description" content="Fast, information-dense quick reference rules cheat sheet for Mutants & Masterminds 3rd Edition in sleek dark mode." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Source Icons (Font Awesome 6 Free CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Top Sticky Navigation / Search / Category Filter Bar -->
    <header class="top-nav">
        <div class="brand-row">
            <div class="brand-title">
                <span>⚡ Mutants & Masterminds 3e</span>
                <span class="badge">Quick Ref</span>
            </div>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search rules, actions, conditions, DC... (Press '/' to focus)" autocomplete="off" />
                <button type="button" id="search-clear" class="search-clear" aria-label="Clear search">✕</button>
            </div>
        </div>
        <nav class="filter-pills" id="filter-pills" aria-label="Categories">
            <!-- Rendered dynamically by app.js -->
        </nav>
    </header>

    <!-- Main Content Sections Container -->
    <main class="page-container" id="sections-container">
        <!-- Rendered dynamically from js/data.js -->
    </main>

    <!-- Modal Popup Dialog (Faithfully mirrors dnd5e-quickref modal structure) -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-dialog">
            <div class="modal-container" id="modal-container">
                <div class="modal-header" id="modal-header">
                    <div id="modal-title">Rule Title</div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span id="modal-type" class="section-limit">Type</span>
                        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close">✕</button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="modal-subtitle" id="modal-subtitle">Short description / trigger</div>
                    <div class="modal-bullets" id="modal-bullets">
                        <!-- Rule details dynamically populated -->
                    </div>
                    <div class="modal-footer">
                        <span>Source Citation:</span>
                        <span class="modal-ref-badge" id="modal-reference">Hero's Handbook 3e</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
